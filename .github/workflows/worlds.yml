name: worlds-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub puede retrasarlo unos minutos
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # para guardar state.json

concurrency:
  group: worlds-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar partidas nuevas
        run: python worlds_webhook.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Guardar estado
        run: |
          git config user.name "worlds-bot"
          git config user.email "worlds-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
